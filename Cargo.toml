[workspace]
members = ["base/runtime"]

[package]
name = "oi"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.6.0"
chumsky = { version = "0.13.0", features = ["pratt"] }
clap = { version = "4.6", features = ["derive"] }
cranelift = "0.132.1"
cranelift-codegen = { version = "0.132.1", features = ["incremental-cache"] }
cranelift-jit = "0.132.1"
cranelift-module = "0.132.1"
cranelift-native = "0.132.1"
cranelift-object = "0.132.1"
target-lexicon = "0.13"
include_dir = "0.7.4"
indoc = "2"
libc = "0.2"
logos = "0.16.1"
oi-runtime = { path = "base/runtime", artifact = "staticlib", lib = true }
reedline = "0.48.0"

[dev-dependencies]
pretty_assertions = "1.4"
